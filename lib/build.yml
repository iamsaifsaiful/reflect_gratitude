# Checks the code and builds the app on GitHub's computers.
# - Android: a test APK you can download from the run's Artifacts.
# - iOS: a compile check (installing on an iPhone needs Apple signing).
# - Web: a preview of the app at https://<your-name>.github.io/<repo-name>/
#   that opens on any phone, including iPhone. Needs GitHub Pages turned on:
#   Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Build app

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: reflect-gratitude-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build check (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  web:
    name: Web preview (GitHub Pages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the web folder with the app's name and colours
        run: |
          flutter create --platforms=web --org com.yeartogether --project-name reflect_gratitude .
          python3 - <<'PY'
          import json, pathlib, re
          m = pathlib.Path("web/manifest.json")
          data = json.loads(m.read_text())
          data.update(name="Reflect & Gratitude", short_name="Reflect", description="A daily reflection and gratitude companion.", background_color="#F4EBDE", theme_color="#F4EBDE")
          m.write_text(json.dumps(data, indent=2))
          p = pathlib.Path("web/index.html")
          h = p.read_text()
          h = re.sub(r"<title>.*?</title>", "<title>Reflect &amp; Gratitude</title>", h, flags=re.S)
          h = re.sub(r'name="apple-mobile-web-app-title" content="[^"]*"', 'name="apple-mobile-web-app-title" content="Reflect"', h)
          h = re.sub(r'name="apple-mobile-web-app-status-bar-style" content="[^"]*"', 'name="apple-mobile-web-app-status-bar-style" content="default"', h)
          h = re.sub(r'name="description" content="[^"]*"', 'name="description" content="A daily reflection and gratitude companion."', h)
          extra = '  <meta name="theme-color" content="#F4EBDE">\n  <style>html, body { background: #F4EBDE; }</style>\n'
          h = h if 'name="theme-color"' in h else h.replace("</head>", extra + "</head>", 1)
          p.write_text(h)
          print("web/index.html and web/manifest.json updated")
          PY

      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
